name: ClassForward factory verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Generate an ephemeral build-only session secret
        run: node -e 'console.log("BETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("base64"))' >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Verify implementation
        run: node scripts/factory-verify.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .factory-runs/**/report.json
            .factory-runs/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
